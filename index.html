<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wiki</title>
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css">
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;color:#263343;background:#fff}header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid #ddd;min-height:60px}button,input{font:inherit}button{padding:7px 12px;background:#fff;border:1px solid #ccd2db;border-radius:6px;cursor:pointer}button.primary{background:#245cb7;color:#fff;border-color:#245cb7}button:disabled{opacity:.5;cursor:default}header strong{font-size:20px}header .space{flex:1}#layout{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - 60px)}aside{background:#f7f8fa;border-right:1px solid #dfe3e8;padding:16px;overflow:auto}aside input{width:100%;padding:8px;border:1px solid #ccd2db;border-radius:6px;margin-bottom:12px}#tree button{display:block;border:0;background:transparent;text-align:left;width:100%;padding:6px 8px;font-size:14px;overflow-wrap:anywhere}#tree button:hover,#tree button.selected{background:#e4ebf6}#tree .folder{font-weight:650}main{padding:28px 42px;min-width:0}#article{max-width:920px;margin:auto;line-height:1.65}#article img{max-width:100%}#article pre{overflow:auto;background:#f5f6f8;padding:14px;border-radius:6px}#article table{border-collapse:collapse}#article td,#article th{border:1px solid #d5dbe3;padding:6px 12px}#article blockquote{border-left:4px solid #ddd;margin-left:0;padding-left:18px;color:#657080}#editorArea{display:none}#panels{display:grid;grid-template-columns:1fr 1fr;gap:12px}#panels.vertical{grid-template-columns:1fr}#panels>section{min-width:0}#panels h3{font-size:14px;margin:4px 0 10px}#status{font-size:13px;color:#657080}#error{color:#b42318;white-space:pre-wrap}.hidden{display:none!important}@media(max-width:850px){#layout{grid-template-columns:175px minmax(0,1fr)}main{padding:18px}#panels{grid-template-columns:1fr}}
</style></head><body>
<header><strong id="siteTitle">Wiki</strong><span id="location"></span><span class="space"></span><span id="status"></span><button id="login">GitHub token</button><button id="edit" class="primary hidden">Edit</button><button id="save" class="primary hidden">Save</button><button id="cancel" class="hidden">Cancel</button></header>
<div id="layout"><aside><input id="repo" placeholder="owner/repository" aria-label="GitHub repository"><button id="openRepo">Open repository</button><hr><nav id="tree"></nav></aside><main><div id="error"></div><article id="article"></article><div id="editorArea"><button id="orientation">Stack panels</button><div id="panels"><section><h3>Markdown</h3><div id="source"></div></section><section><h3>WYSIWYG</h3><div id="visual"></div></section></div></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const md=window.markdownit({html:false,linkify:true,breaks:false});
let repo='',branch='',files=[],page='',sha='',original='',source=null,visual=null,editing=false,syncTimer=null,updating=false;
let token=sessionStorage.getItem('wiki-github-token')||'';
const esc=s=>encodeURIComponent(s).replace(/%2F/g,'/');
function route(){const h=decodeURIComponent(location.hash.slice(1));const m=h.match(/^\/([^/]+)\/([^/]+)(?:\/(.*))?$/);return m?{repo:m[1]+'/'+m[2],path:m[3]||'index.md'}:null}
function navigate(path){location.hash='/'+repo+'/'+path}
function api(path,options={}){const headers={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(token?{'Authorization':'Bearer '+token}:{})};if(options.body)headers['Content-Type']='application/json';return fetch('https://api.github.com'+path,{...options,headers:{...headers,...options.headers},cache:'no-store'}).then(async r=>{if(!r.ok)throw Error('GitHub '+r.status+': '+((await r.json().catch(()=>({}))).message||r.statusText));return r.status===204?null:r.json()})}
function decode64(s){const bytes=Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
function encode64(s){const bytes=new TextEncoder().encode(s);let binary='';for(const b of bytes)binary+=String.fromCharCode(b);return btoa(binary)}
function setError(e){$('error').textContent=e?String(e.message||e):''}
function setStatus(s){$('status').textContent=s}
function label(p){return p.split('/').pop().replace(/\.md$/i,'').replace(/[-_]/g,' ')}
async function openRepository(name){if(!/^[\w.-]+\/[\w.-]+$/.test(name))throw Error('Enter a repository as owner/name');repo=name;$('repo').value=repo;$('siteTitle').textContent=repo.split('/')[1];setStatus('Loading tree…');const info=await api('/repos/'+repo);branch=info.default_branch;const tree=await api('/repos/'+repo+'/git/trees/'+encodeURIComponent(branch)+'?recursive=1');if(tree.truncated)throw Error('Repository tree too large for this prototype');files=tree.tree.filter(f=>f.type==='blob'&&f.path.toLowerCase().endsWith('.md')).map(f=>f.path).sort();renderTree();setStatus('');}
function renderTree(){const nav=$('tree');nav.replaceChildren();const folders=new Set();for(const f of files){const parts=f.split('/');for(let i=1;i<parts.length;i++)folders.add(parts.slice(0,i).join('/'))}
const paths=[...folders].map(p=>({path:p,folder:true})).concat(files.map(p=>({path:p,folder:false}))).sort((a,b)=>a.path.localeCompare(b.path));for(const entry of paths){const b=document.createElement('button');const depth=entry.path.split('/').length-1;b.style.paddingLeft=(8+depth*14)+'px';b.className=(entry.folder?'folder ':'')+(entry.path===page?'selected':'');b.textContent=(entry.folder?'▸ ':'▤ ')+label(entry.path);b.onclick=()=>{if(editing&&!confirm('Discard unsaved edits?'))return;if(entry.folder){const p=entry.path+'/index.md';if(files.includes(p))navigate(p)}else navigate(entry.path)};nav.appendChild(b)}}
function assetUrl(path){const base=page.includes('/')?page.slice(0,page.lastIndexOf('/')+1):'';const segments=(base+path).split('/'),out=[];for(const s of segments){if(s==='..')out.pop();else if(s&&s!=='.')out.push(s)}return 'https://raw.githubusercontent.com/'+repo+'/'+encodeURIComponent(branch)+'/'+out.map(encodeURIComponent).join('/')}
function render(content){const root=$('article');root.innerHTML=DOMPurify.sanitize(md.render(content));root.querySelectorAll('a[href]').forEach(a=>{const href=a.getAttribute('href');if(!href||href.startsWith('#')||/^[a-z]+:/i.test(href))return;const target=assetPath(href.split('#')[0]);if(files.includes(target)){a.href='#/'+repo+'/'+target}});root.querySelectorAll('img[src]').forEach(img=>{const src=img.getAttribute('src');if(src&&!/^(https?:|data:|\/)/i.test(src))img.src=assetUrl(src)})}
function assetPath(path){const base=page.includes('/')?page.slice(0,page.lastIndexOf('/')+1):'';const out=[];for(const s of (base+path).split('/')){if(s==='..')out.pop();else if(s&&s!=='.')out.push(s)}let p=out.join('/');if(!p.endsWith('.md'))p=p.replace(/\/$/,'')+'/index.md';return p}
async function showRoute(){const r=route();if(!r){$('article').innerHTML='<h1>Wiki</h1><p>Enter a GitHub repository in the sidebar, or open a link like <code>#/owner/repo/index.md</code>.</p>';return}if(editing)return;try{setError('');if(repo!==r.repo)await openRepository(r.repo);page=r.path;if(!files.includes(page)){page=files.includes(r.path+'/index.md')?r.path+'/index.md':files.includes('index.md')?'index.md':files[0];if(!page)throw Error('No Markdown files in repository');if(page!==r.path){navigate(page);return}}setStatus('Loading…');const data=await api('/repos/'+repo+'/contents/'+page+'?ref='+encodeURIComponent(branch));sha=data.sha;original=decode64(data.content);render(original);$('location').textContent=' / '+page;renderTree();$('edit').classList.toggle('hidden',!token);setStatus('')}catch(e){setError(e);setStatus('')}}
function createEditors(){if(source)return;source=new toastui.Editor({el:$('source'),height:'65vh',initialEditType:'markdown',previewStyle:'tab',hideModeSwitch:true,usageStatistics:false});visual=new toastui.Editor({el:$('visual'),height:'65vh',initialEditType:'wysiwyg',hideModeSwitch:true,usageStatistics:false});source.on('change',()=>sync(source,visual));visual.on('change',()=>sync(visual,source))}
function sync(from,to){if(updating)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>{if(updating)return;updating=true;try{const content=from.getMarkdown();if(to.getMarkdown()!==content)to.setMarkdown(content,false)}finally{updating=false}},200)}
function setEditing(value){editing=value;$('article').classList.toggle('hidden',value);$('editorArea').style.display=value?'block':'none';$('edit').classList.toggle('hidden',value||!token);$('save').classList.toggle('hidden',!value);$('cancel').classList.toggle('hidden',!value)}
$('edit').onclick=()=>{createEditors();updating=true;source.setMarkdown(original,false);visual.setMarkdown(original,false);updating=false;setEditing(true)};
$('cancel').onclick=()=>{clearTimeout(syncTimer);setEditing(false);render(original)};
$('save').onclick=async()=>{try{clearTimeout(syncTimer);const content=source.getMarkdown();if(content===original){setEditing(false);return}setStatus('Committing…');$('save').disabled=true;const result=await api('/repos/'+repo+'/contents/'+page,{method:'PUT',body:JSON.stringify({message:'Update '+page,content:encode64(content),sha,branch})});sha=result.content.sha;original=content;setEditing(false);render(original);setStatus('Saved to GitHub');setError('')}catch(e){setError(e);setStatus('')}finally{$('save').disabled=false}};
$('login').onclick=()=>{const value=prompt('Fine-grained GitHub token with Contents: Read and write permission for your wiki repositories. Leave blank to sign out. The token is kept only in this browser tab session.',token);if(value===null)return;token=value.trim();if(token)sessionStorage.setItem('wiki-github-token',token);else sessionStorage.removeItem('wiki-github-token');$('edit').classList.toggle('hidden',!token||editing);showRoute()};
$('openRepo').onclick=()=>{const name=$('repo').value.trim();if(!/^[\w.-]+\/[\w.-]+$/.test(name)){setError('Use owner/repository');return}repo='';navigate('index.md'.replace(/^/,''));location.hash='/'+name+'/index.md'};
$('orientation').onclick=()=>{const vertical=$('panels').classList.toggle('vertical');$('orientation').textContent=vertical?'Side-by-side panels':'Stack panels'};
window.addEventListener('hashchange',showRoute);showRoute();
</script></body></html>
